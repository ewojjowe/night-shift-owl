# Render Infrastructure as Code — both services from one repo.
#
# To use: Render dashboard → Blueprints → connect this repo → Render creates both
# services from this file. Secrets (sync: false) must be set manually in the
# dashboard after creation.
#
# See night-shift-app/DEPLOYMENT.md for the full deployment guide.

services:
  # --- Backend: FastAPI (Docker) -------------------------------------------
  - type: web
    name: night-shift-backend
    runtime: docker
    repo: https://github.com/your-org/NightOwlLearning  # replace with your repo URL
    rootDir: night-shift-app/backend
    branch: main
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false  # set manually — secret (Atlas connection string)
      - key: JWT_ACCESS_SECRET
        sync: false  # set manually — secret
      - key: JWT_REFRESH_SECRET
        sync: false  # set manually — secret
      - key: MONGO_DB_NAME
        value: night_shift
      - key: ACCESS_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: '["https://night-shift-app.onrender.com"]'  # update to your Static Site URL

  # --- Frontend: Vue 3 + Vite (Static Site) --------------------------------
  - type: web
    plan: free
    name: night-shift-app
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: night-shift-app/frontend
    branch: main
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://night-shift-backend.onrender.com # update to your Web Service URL
